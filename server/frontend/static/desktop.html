<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>K16S — Desktop</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0d0f16; overflow: hidden; }
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 16px;
    align-items: center; justify-content: center; background: #0d0f16;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #overlay img { height: 40px; opacity: 0.9; }
  #enter {
    padding: 12px 28px; font-size: 15px; font-weight: 600; border-radius: 6px; border: 0;
    background: #3b82f6; color: white; cursor: pointer;
  }
  #enter:hover { background: #2563eb; }
  #hint { color: #64748b; font-size: 13px; }
</style>
</head>
<body>
  <div id="overlay">
    <img src="/logo.svg" alt="K16S" />
    <button id="enter">Enter Desktop</button>
    <div id="hint">Opens in fullscreen — press Esc to exit</div>
  </div>
  <iframe id="frame" title="Desktop"
    src="/desktop/vnc_lite.html?autoconnect=true&resize=remote&reconnect=true&path=desktop/websockify"></iframe>
  <script>
    document.getElementById('enter').addEventListener('click', () => {
      const el = document.documentElement;
      const request = el.requestFullscreen || el.webkitRequestFullscreen;
      if (request) request.call(el).catch(() => {});
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('frame').style.display = 'block';
    });
  </script>
</body>
</html>
