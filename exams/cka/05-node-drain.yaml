id: 05-node-drain
title: Drain and Uncordon a Node
weight: 3
context: controlplane
description: |
  Perform the following node maintenance tasks:

  1. **Drain** node `node01`, evicting all pods (ignore DaemonSets).
  2. Simulate maintenance (no actual action required).
  3. **Uncordon** node `node01` to make it schedulable again.

  After uncordoning, `node01` must be in **Ready** and **schedulable** state.
hint: "Use `kubectl drain node01 --ignore-daemonsets --delete-emptydir-data` then `kubectl uncordon node01`. The node must end up Ready and not have the NoSchedule taint."
