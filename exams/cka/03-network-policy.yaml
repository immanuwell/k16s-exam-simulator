id: 03-network-policy
title: Restrict Pod Traffic with a NetworkPolicy
weight: 6
context: ""
description: |
  A namespace `secured` contains a Pod named `backend` (label: `app=backend`) and a Pod named `frontend` (label: `app=frontend`).

  Create a **NetworkPolicy** named `allow-frontend` in namespace `secured` that:

  - Allows **ingress** to `backend` pods only from pods with label `app=frontend`
  - Denies all other ingress traffic to `backend`

  There should be **no egress restrictions**.
hint: "Use podSelector on the NetworkPolicy to target backend pods, and set an ingress rule with a namespaceSelector or podSelector matching the frontend label."
