id: 01-static-pod
title: Create a Static Pod
weight: 4
context: controlplane
description: |
  Create a **static Pod** named `static-web` on the **controlplane** node with the following specification:

  - Image: `nginx:alpine`
  - Label: `tier=frontend`

  The Pod must be created using a manifest file in the kubelet static pod directory.
hint: "Kubelet watches /etc/kubernetes/manifests/ for static pod definitions. The Pod name will be suffixed with the node name (e.g. static-web-controlplane)."
