id: 07-kubeconfig-sa
title: Create a kubeconfig for a ServiceAccount
weight: 5
context: controlplane
description: |
  Create a fully functional kubeconfig for the ServiceAccount `deploy-bot`
  so it can authenticate to the cluster.

  The ServiceAccount `deploy-bot` already exists in namespace `ci-cd`.

  1. Generate a token for the ServiceAccount:
     ```
     TOKEN=$(kubectl create token deploy-bot -n ci-cd --duration=24h)
     ```

  2. Build a kubeconfig at `/opt/cka2/deploy-bot.kubeconfig`:
     ```
     SERVER=$(kubectl config view -o jsonpath='{.clusters[0].cluster.server}')
     CA=$(kubectl config view --raw \
       -o jsonpath='{.clusters[0].cluster.certificate-authority-data}')

     kubectl config set-cluster exam-cluster \
       --server=$SERVER \
       --certificate-authority-data=$CA \
       --kubeconfig=/opt/cka2/deploy-bot.kubeconfig

     kubectl config set-credentials deploy-bot \
       --token=$TOKEN \
       --kubeconfig=/opt/cka2/deploy-bot.kubeconfig

     kubectl config set-context deploy-bot-context \
       --cluster=exam-cluster \
       --user=deploy-bot \
       --kubeconfig=/opt/cka2/deploy-bot.kubeconfig

     kubectl config use-context deploy-bot-context \
       --kubeconfig=/opt/cka2/deploy-bot.kubeconfig
     ```

  3. Verify the kubeconfig works:
     ```
     kubectl --kubeconfig=/opt/cka2/deploy-bot.kubeconfig cluster-info \
       > /opt/cka2/deploy-bot-cluster-info.txt
     ```
hint: |
  `kubectl create token` generates a short-lived bound token (no Secret needed).
  `--certificate-authority-data` expects a base64-encoded CA, which is already
  in that format from `kubectl config view --raw`.
