id: 12-secret-mount
title: Create a Secret and Mount it Two Ways
weight: 4
context: ""
description: |
  Kubernetes Secrets can be consumed either as environment variables or as files.
  Demonstrate both methods in a single pod.

  1. Create a **Secret** named `app-credentials` in namespace `secret-demo`:
     - `username: admin`
     - `password: S3cur3P@ss!`

     ```
     kubectl create secret generic app-credentials \
       --from-literal=username=admin \
       --from-literal='password=S3cur3P@ss!' \
       -n secret-demo
     ```

  2. Create a **Pod** named `secret-consumer` in namespace `secret-demo`
     (image: `busybox:1.36`, `command: ["sh","-c","env && ls /etc/creds && sleep 3600"]`)
     that:
     - Exposes `username` as env var `APP_USER` (via `secretKeyRef`)
     - Exposes `password` as env var `APP_PASS` (via `secretKeyRef`)
     - Mounts the **entire** Secret as files under `/etc/creds/`
       (so `/etc/creds/username` and `/etc/creds/password` exist)

  3. Verify both methods work:
     ```
     kubectl logs secret-consumer -n secret-demo
     kubectl exec secret-consumer -n secret-demo -- cat /etc/creds/username
     ```

  4. Save the pod logs to `/opt/cka2/secret-consumer.txt`:
     ```
     kubectl logs secret-consumer -n secret-demo > /opt/cka2/secret-consumer.txt
     ```
hint: |
  Pod spec snippet for dual consumption:
  ```yaml
  env:
  - name: APP_USER
    valueFrom:
      secretKeyRef:
        name: app-credentials
        key: username
  - name: APP_PASS
    valueFrom:
      secretKeyRef:
        name: app-credentials
        key: password
  volumeMounts:
  - name: creds
    mountPath: /etc/creds
    readOnly: true
  volumes:
  - name: creds
    secret:
      secretName: app-credentials
  ```
